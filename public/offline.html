<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#16a34a">
<title>Offline · Ilmora</title>
<style>
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f7f9fc;color:#1f2937;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:16px;box-sizing:border-box}
  .card{max-width:360px;text-align:center;background:#fff;border:1px solid #c0c8c5;border-radius:16px;padding:28px 20px}
  img{width:72px;height:72px;border-radius:16px}
  h1{font-size:20px;margin:16px 0 6px}
  p{margin:0 0 4px;color:#6b7280;line-height:1.5}
  .ur{font-family:"Noto Nastaliq Urdu",serif;direction:rtl}
  button{margin-top:18px;min-height:44px;padding:0 22px;border:0;border-radius:10px;background:#16a34a;color:#fff;font-weight:700;font-size:15px}
</style>
</head>
<body>
  <div class="card">
    <img src="/icons/icon-192.png" alt="">
    <h1>No internet right now</h1>
    <p>Ilmora will open as soon as the connection is back.</p>
    <p>Internet nahi hai. Connection aate hi Ilmora khul jaye ga.</p>
    <button type="button" onclick="location.reload()">Try again</button>
  </div>
</body>
</html>
