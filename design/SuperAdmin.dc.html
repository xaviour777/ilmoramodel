<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Ilmora platform — Super admin</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ilmora.css">
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#f7f9fc}
.nb{display:flex;align-items:center;gap:12px;width:100%;min-height:44px;padding:4px 10px;border:2px solid transparent;border-radius:14px;background:none;font-weight:800;font-size:14px;color:#4b5563;cursor:pointer;text-align:left}
.nb:hover{background:#f1f5f9;color:#1f2937}
.nb.on{background:#e0f2fe;border-color:#7dd3fc;color:#0369a1;box-shadow:0 3px 0 #7dd3fc}
.kp2{background:#fff;border:2px solid #e5e7eb;border-radius:16px;padding:12px 14px;display:flex;flex-direction:column;gap:2px}
.hbar{display:flex;align-items:center;gap:8px;font-weight:800;font-size:13px;padding:5px 0}
.hbar .t{flex:1;height:14px;border-radius:99px;background:#eef2f7;overflow:hidden}
.hbar .t i{display:block;height:100%;border-radius:99px}
.blocks{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}
.span2{grid-column:1 / -1}
@media (max-width:900px){.blocks{grid-template-columns:minmax(0,1fr)}}
td.b{font-weight:900}td.g{color:#15803d;font-weight:900}td.r{color:#b91c1c;font-weight:900}
tr.tot td{border-top:3px solid #1f2937;font-weight:900}
</style>
</helmet>
<div class="shell">
  <nav aria-label="Main" class="side">
    <div class="brand"><div class="logo" style="background:#0f172a;box-shadow:0 4px 0 #000">i</div><div><div style="font-weight:900;font-size:17px">Ilmora platform</div><div class="muted" style="font-size:12px">Super admin</div></div></div>
    <sc-for list="{{nav}}" as="g" hint-placeholder-count="5">
      <div>
        <div class="grp">{{g.label}}</div>
        <sc-for list="{{g.items}}" as="i" hint-placeholder-count="3">
          <button type="button" class="{{i.cls}}" onClick="{{i.pick}}"><span class="tile {{i.tile}}" style="width:30px;height:30px;font-weight:900;font-size:12px">{{i.ini}}</span><span style="flex:1">{{i.label}}</span><sc-if value="{{i.hasBadge}}" hint-placeholder-val="{{ false }}"><span class="badge">{{i.badge}}</span></sc-if></button>
        </sc-for>
      </div>
    </sc-for>
    <div class="me"><div class="av" style="background:#0f172a;color:#fff">SA</div><div><div style="font-weight:900;font-size:14px">admin@ilmora.pk</div><div class="muted" style="font-size:12px">Super admin · 2FA on</div></div></div>
  </nav>

  <main class="content">
    <div class="wrap">
      <header style="display:flex;flex-wrap:wrap;gap:16px;justify-content:space-between;align-items:flex-end">
        <div><div class="lbl">{{scr.group}}</div><h1 class="title">{{scr.title}}</h1><p class="sub">{{scr.sub}}</p></div>
        <div style="display:flex;gap:10px;flex-wrap:wrap"><button type="button" class="chunk w">Export</button><button type="button" class="chunk">{{scr.cta}}</button></div>
      </header>

      <section style="display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px">
        <sc-for list="{{scr.kpis}}" as="k" hint-placeholder-count="4">
          <div class="kp2"><span class="lbl" style="font-size:11px">{{k.l}}</span><span style="font-weight:900;font-size:24px;color:{{k.c}}">{{k.v}}</span><span class="muted" style="font-size:12px">{{k.n}}</span></div>
        </sc-for>
      </section>

      <div class="blocks">
        <sc-for list="{{scr.blocks}}" as="b" hint-placeholder-count="4">
          <section class="{{b.cls}}">
            <div style="display:flex;flex-wrap:wrap;gap:8px;justify-content:space-between;align-items:center"><h2 class="h2" style="color:{{b.hc}}">{{b.title}}</h2><span class="muted" style="font-size:12px">{{b.sub}}</span></div>
            <sc-if value="{{b.isTable}}" hint-placeholder-val="{{ true }}">
              <div class="tbl" style="margin-top:10px"><table style="min-width:{{b.minw}}">
                <thead><tr><sc-for list="{{b.head}}" as="h" hint-placeholder-count="5"><th>{{h}}</th></sc-for></tr></thead>
                <tbody><sc-for list="{{b.rows}}" as="r" hint-placeholder-count="4"><tr class="{{r.cls}}"><sc-for list="{{r.cells}}" as="c" hint-placeholder-count="5"><td class="{{c.cls}}"><sc-if value="{{c.isTag}}" hint-placeholder-val="{{ false }}"><span class="{{c.tag}}">{{c.v}}</span></sc-if><sc-if value="{{c.isText}}" hint-placeholder-val="{{ true }}">{{c.v}}</sc-if></td></sc-for></tr></sc-for></tbody>
              </table></div>
            </sc-if>
            <sc-if value="{{b.isBars}}" hint-placeholder-val="{{ false }}">
              <div style="margin-top:10px"><sc-for list="{{b.items}}" as="x" hint-placeholder-count="5"><div class="hbar"><span style="width:130px">{{x.n}}</span><div class="t"><i style="width:{{x.w}};background:{{x.c}}"></i></div><span style="width:110px;text-align:right">{{x.v}}</span></div></sc-for></div>
            </sc-if>
            <sc-if value="{{b.isList}}" hint-placeholder-val="{{ false }}">
              <div style="margin-top:6px"><sc-for list="{{b.items}}" as="x" hint-placeholder-count="4">
                <div class="row"><span class="tile {{x.tile}}" style="font-weight:900;font-size:13px">{{x.ini}}</span><div style="flex:1 1 220px"><div style="font-weight:900">{{x.t}}</div><div class="muted" style="font-size:12px">{{x.d}}</div></div><span style="font-weight:900">{{x.amt}}</span>
                  <sc-if value="{{x.open}}" hint-placeholder-val="{{ false }}"><div style="display:flex;gap:6px"><button type="button" class="chunk w sm" onClick="{{x.no}}">{{x.nl}}</button><button type="button" class="chunk sm" onClick="{{x.yes}}">{{x.yl}}</button></div></sc-if>
                  <sc-if value="{{x.hasTag}}" hint-placeholder-val="{{ false }}"><span class="{{x.tc}}">{{x.tag}}</span></sc-if>
                  <sc-if value="{{x.hasBtn}}" hint-placeholder-val="{{ false }}"><button type="button" class="chunk w sm">{{x.btn}}</button></sc-if>
                </div>
              </sc-for></div>
            </sc-if>
            <sc-if value="{{b.isNote}}" hint-placeholder-val="{{ false }}">
              <ul style="margin:10px 0 0;padding-left:18px;line-height:24px;font-weight:700"><sc-for list="{{b.items}}" as="x" hint-placeholder-count="3"><li>{{x}}</li></sc-for></ul>
            </sc-if>
          </section>
        </sc-for>
      </div>
    </div>
  </main>
</div>
</x-dc>
